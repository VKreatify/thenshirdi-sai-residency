<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Aura — Interactive Kinetic Sphere</title>
    <meta name="description" content="A minimalist interactive digital art piece featuring a translucent peach-pink orb with roaming stardust particles and cinematic glow." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Full-screen Ambient Background Glow -->
    <div class="ambient-glow" id="bg-glow"></div>

    <!-- WebGL Fullscreen Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Minimalist Interactive Instruction -->
    <div class="interaction-hint">
      Move cursor to tilt sphere, rotate particles, and shift glow.
    </div>

    <!-- Core Script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
